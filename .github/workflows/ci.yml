name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: tenant + mock-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: tenant (validação e gerador)
        run: npm test --workspace tools/tenant
      - name: mock-server lint
        run: npm run lint --workspace mock-server
      - name: mock-server tipos
        run: npm run typecheck --workspace mock-server
      - name: mock-server testes de contrato
        run: npm test --workspace mock-server

  mobile:
    name: app Flutter (analyze, test, APK debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: gerar marca do tenant
        run: node ../../tools/tenant/generate.mjs liveapp
      - run: flutter pub get
      - name: gerar código (l10n, freezed, json)
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi
          if grep -q build_runner pubspec.yaml; then dart run build_runner build --delete-conflicting-outputs; fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: APK debug (liveapp)
        run: flutter build apk --debug --flavor liveapp -t lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: liveapp-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-liveapp-debug.apk
          retention-days: 14
